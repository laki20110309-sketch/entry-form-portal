<!doctype html>
<html lang="ja">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Entry Atelier | フォーム管理</title><link rel="stylesheet" href="styles.css"></head>
<body>
<header class="topbar"><a class="brand" href="#public"><span class="mark">✦</span><span>Entry Atelier</span></a><nav><button data-view="public" class="nav-btn active">公開フォーム</button><button id="login-btn" class="nav-btn login-btn">ログイン</button><button data-view="admin" class="nav-btn admin-nav">管理画面</button></nav></header>
<main>
<section id="public" class="view active"><div class="hero"><p class="eyebrow">FORM MANAGEMENT, REFINED</p><h1>宙aim<em>cup</em>エントリーフォーム</h1>2026/09/26.27<p class="lead"></p></div><div id="form-root" class="panel form-panel"></div></section>
<section id="admin" class="view"><div class="admin-head"><div><p class="eyebrow">ENTRY ATELIER / ADMIN</p><h2>フォーム申請用</h2><p class="muted">回答をディスコードへ送信します。</p></div><span class="button-row"><button id="share-form" class="secondary">共有リンクをコピー</button><button id="save-form" class="primary">設定を保存</button></span></div><div class="admin-grid"><aside class="panel form-list"><h3>フォーム</h3><button id="new-form" class="secondary full">＋ 新しいフォーム</button><div id="form-list"></div></aside><div class="panel builder"><div class="field-grid"><label>フォーム名<input id="title"></label><label>URLスラッグ<input id="slug"></label><label class="wide">説明文<textarea id="description"></textarea></label><label>受付状態<select id="status"><option value="draft">下書き</option><option value="open">受付中</option><option value="closed">受付終了</option></select></label><label>通知識別コード<input id="notificationCode" placeholder="例：TEAM-A"></label><label>完了メッセージ<input id="successMessage"></label></div><div class="divider"></div><div class="builder-title"><div><p class="eyebrow">QUESTIONS</p><h3>質問設計</h3></div><button id="add-question" class="secondary">＋ 質問を追加</button></div><div id="questions"></div><div class="divider"></div><h3>回答履歴</h3><div id="responses" class="responses"></div></div></div></section>
</main><div id="toast" class="toast"></div><script src="config.js"></script><script src="app.js"></script></body></html>
